<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New World Telecom — Control Presupuestario y KPIs Financieros</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0E2A47; --navy-dark:#0A2038; --teal:#17B8AE; --teal-dark:#0E8A82;
    --bg:#F4F6F8; --card:#FFFFFF; --text:#20242A; --muted:#697485;
    --border:#E4E8ED; --alert:#E15759; --ok:#3FA796; --amber:#E8A33D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .navbar{background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 20px;height:56px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15);flex-wrap:wrap;}
  .brand{font-weight:700;font-size:16px;margin-right:28px;white-space:nowrap;}
  .brand span{color:var(--teal);}
  .navtabs{display:flex;gap:4px;flex:1;overflow-x:auto;}
  .navtabs button{background:transparent;border:none;color:#C9D3DE;font-size:14px;padding:16px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:.15s;}
  .navtabs button:hover{color:#fff;}
  .navtabs button.active{color:#fff;border-bottom-color:var(--teal);font-weight:600;}
  .updated{font-size:11px;color:#8194A8;padding-left:10px;white-space:nowrap;}

  .page{display:none;padding:22px 26px 60px;max-width:1400px;margin:0 auto;}
  .page.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .page-title{font-size:22px;font-weight:700;color:var(--navy);margin:4px 0 4px;}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:18px;}

  .filters{display:flex;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;}
  .filter{display:flex;flex-direction:column;gap:4px;min-width:150px;}
  .filter label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;}
  .filter select{padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:13px;color:var(--text);}

  .kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .kpi .val{font-size:26px;font-weight:800;color:var(--navy);line-height:1.15;}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;}
  .kpi .delta{font-size:12px;margin-top:6px;font-weight:700;}
  .delta.up{color:var(--ok);} .delta.down{color:var(--alert);}

  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
  @media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .card h3{margin:0 0 4px;font-size:14px;color:var(--navy);}
  .card .cardsub{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .chartwrap{position:relative;height:280px;}
  .chartwrap.tall{height:340px;}

  table.datatable{width:100%;border-collapse:collapse;font-size:13px;}
  table.datatable th{text-align:left;background:var(--navy);color:#fff;padding:9px 10px;font-weight:600;position:sticky;top:0;}
  table.datatable td{padding:8px 10px;border-bottom:1px solid var(--border);}
  table.datatable tr:hover td{background:#F0F4F7;}
  .tablewrap{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .tag.bad{background:#FBE4E4;color:#B23A3C;}
  .tag.good{background:#E1F3EE;color:#0E8A82;}
  .tag.neutral{background:#EEF1F4;color:var(--muted);}

  .searchbox{margin-bottom:12px;}
  .searchbox input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 0 40px;}
</style>
</head>
